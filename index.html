<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XK</title>
    <link rel="icon" type="image/svg+xml" href="/assets/XK1B.svg" />
  </head>

  <body>
    <div id="loader" class="loader">
      <div class="loader-inner">
        <img src="/assets/XK1W.svg" alt="XK" class="loader-logo" />
        <div class="loader-text" aria-label="Loading">
          LOADING<span class="loading-dots">
            <span>.</span><span>.</span><span>.</span>
          </span>
        </div>
      </div>
    </div>

    <nav id="main-nav" class="home-nav" aria-label="Main navigation">
      <button class="home-nav-button" type="button" data-route="/">HOME</button>
      <button class="home-nav-button" type="button" data-route="/work">WORK</button>
      <button class="home-nav-button" type="button" data-route="/about">ABOUT</button>
      <button class="home-nav-button" type="button" data-route="/contact">CONTACT</button>
      <a id="nav-slide-caption" class="nav-slide-caption" href="#"></a>
    </nav>

    <button class="mobile-menu-toggle" id="mobile-menu-toggle" type="button" aria-label="Open menu">
      <img src="/assets/icons/menu_w.svg" alt="" />
    </button>

    <div id="mobile-menu" class="mobile-menu" aria-hidden="true">
      <div class="mobile-menu-inner">
        <div class="mobile-menu-links">
          <button class="mobile-menu-link" type="button" data-mobile-route="/">HOME</button>
          <button class="mobile-menu-link" type="button" data-mobile-route="/work">WORK</button>
          <button class="mobile-menu-link" type="button" data-mobile-route="/about">ABOUT</button>
          <button class="mobile-menu-link" type="button" data-mobile-route="/contact">CONTACT</button>
        </div>
        <button class="mobile-menu-close" id="mobile-menu-close" type="button" aria-label="Close menu">[X]</button>
      </div>
    </div>

    <div id="menu-blur-overlay" class="menu-blur-overlay"></div>

    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
